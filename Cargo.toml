[package]
name = "cbpf-rs"
version = "0.2.1"
edition = "2024"
description = "Rust compiler from pcap-filter expressions to cBPF bytecode"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nullsych/cbpf-rs"
readme = "README.md"
keywords = ["bpf", "pcap", "packet", "networking", "filter"]
categories = ["network-programming", "parser-implementations"]
exclude = ["/.github", "/tests/corpus"]

[features]
default = ["std"]
std = []

# `attach` talks to a real OS socket, so it necessarily requires `std`
# (a RawFd, std::io::Result) in addition to libc.
attach = ["dep:libc", "std"]

[dependencies]

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

# Standalone, root-required tool (see the module doc comment in examples/kernel_diff.rs) - not run by
# `cargo test`, and `required-features` keeps a plain `cargo build`/`cargo test` (no `--features attach`)
# from trying to compile it at all.
[[example]]
name = "kernel_diff"
required-features = ["attach"]
